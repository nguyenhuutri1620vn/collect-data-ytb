[project]
name = "collect-data-ytb"
version = "0.1.0"
description = "Collects Saigon places from short YouTube videos"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "geoalchemy2",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
